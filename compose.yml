# GPS/PPS-disciplined stratum-1 NTP server. See README.md for host prep.

# Container logs to journald, which is volatile on Pi OS: nothing on the SD card.
x-logging: &logging
  driver: journald

services:
  chrony:
    build:
      dockerfile_inline: |
        FROM alpine:3.24
        RUN apk add --no-cache chrony-nts ca-certificates tzdata   # 3.24+: plain chrony is built without NTS; tzdata for leapseclist
    command: chronyd -d -r -f /etc/chrony/chrony.conf  # -r: reload dumpdir history on start
    network_mode: host               # UDP 123 without NAT; real client IPs
    ipc: host                        # gpsd writes NMEA time into SHM; host IPC survives restarts of either container
    cap_add: [SYS_TIME, SYS_NICE, IPC_LOCK]  # clock, sched_priority, lock_all
    ulimits:
      memlock: -1                    # lock_all
    devices:
      - /dev/pps0
    volumes:
      - ./chrony.conf:/etc/chrony/chrony.conf:ro
      - ./chrony-tempcomp.points:/etc/chrony/tempcomp.points:ro
      - /usr/share/zoneinfo/leap-seconds.list:/usr/share/zoneinfo/leap-seconds.list:ro  # host tzdata
      - chrony-state:/var/lib/chrony # drift file survives restarts
      - chrony-run:/run/chrony       # chronyd.sock, shared with api
      - tempcomp-run:/run/tempcomp:ro  # smoothed CPU temperature for tempcomp
    tmpfs:
      - /run
    depends_on:
      tempsmooth:
        condition: service_healthy
    mem_limit: 384m                  # clientloglimit 128 MiB, locked (lock_all)
    logging: *logging
    restart: unless-stopped
    healthcheck:                     # chronyd answers on its command socket
      test: ["CMD", "chronyc", "-n", "tracking"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # CPU temperature as a 5 min moving average (EMA, 5 s samples) for chrony's tempcomp.
  # The raw sensor jumps up to ~2.4 °C between reads; read directly every 30 s, that stepped
  # the compensation by up to 2 ppm and put ~10 µs spikes on the offset.
  tempsmooth:
    image: alpine:3.24
    command:
      - sh
      - -c
      - |
        f=/sys/class/thermal/thermal_zone0/temp; o=/run/tempcomp/temp
        e=$$(( $$(cat $$f) * 60 ))
        while :; do
          e=$$(( e + $$(cat $$f) - e / 60 ))
          echo $$(( e / 60 )) > $$o.tmp && mv $$o.tmp $$o
          sleep 5
        done
    init: true                       # sh as PID 1 would ignore SIGTERM
    network_mode: none
    user: "100:101"
    volumes:
      - tempcomp-run:/run/tempcomp
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 16m
    logging: *logging
    restart: unless-stopped
    healthcheck:                     # file rewritten within the last minute
      test: ["CMD-SHELL", "test -n \"$$(find /run/tempcomp/temp -mmin -1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s

  gpsd:
    build:
      dockerfile_inline: |
        FROM alpine:3.24
        RUN apk add --no-cache gpsd
    command: gpsd -N -n -G /dev/ttyAMA2
    network_mode: host               # cgps/gpsmon on host via localhost:2947
    ipc: host                        # same SHM as chrony (see above)
    devices:
      - /dev/ttyAMA2
    depends_on: [chrony]
    mem_limit: 64m
    logging: *logging
    restart: unless-stopped

  api:
    build:
      context: .                     # needs web/ for the UI stage
      dockerfile: api/Dockerfile
    network_mode: host               # reaches gpsd on 127.0.0.1:2947; serves :8000
    user: "100:101"                  # chrony uid/gid in the chrony image: may use chronyd.sock
    env_file:
      - path: .env                   # MQTT_HOST, MQTT_USER, MQTT_PASSWORD, ... (see .env.example)
        required: false
    volumes:
      - chrony-run:/run/chrony
      - api-data:/data               # history.db, written in batches (HISTORY_FLUSH_MINUTES)
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on: [chrony, gpsd]
    cpus: 1.0                        # runaway guard; chronyd runs at RT priority anyway
    mem_limit: 512m                  # ~135 MiB at netspeed 50 Mbit (2026-10-18); generous headroom
    logging: *logging
    restart: unless-stopped
    healthcheck:                     # HTTP server responsive and gpsd + chronyd reachable (503 otherwise)
      test: ["CMD-SHELL", "wget -q -O /dev/null -T 5 http://127.0.0.1:$${API_PORT:-8000}/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  chrony-state:
  api-data:
  chrony-run:                        # tmpfs: socket only, keep it off the SD card
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: uid=100,gid=101,mode=0750
  tempcomp-run:                      # tmpfs: rewritten every 5 s, keep it off the SD card
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: uid=100,gid=101,mode=0755
