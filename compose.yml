# GPS/PPS-disciplined stratum-1 NTP server. See README.md for host prep.

# Container logs to journald, which is volatile on Pi OS: nothing on the SD card.
# chrony and gpsd get `logging: *logging` at their next planned recreate
# (a chrony recreate costs pool score).
x-logging: &logging
  driver: journald

services:
  chrony:
    build:
      dockerfile_inline: |
        FROM alpine:3.24
        RUN apk add --no-cache chrony-nts ca-certificates   # 3.24+: plain chrony is built without NTS
    command: chronyd -d -f /etc/chrony/chrony.conf
    network_mode: host               # UDP 123 without NAT; real client IPs
    ipc: host                        # gpsd writes NMEA time into SHM; host IPC survives restarts of either container
    cap_add: [SYS_TIME, SYS_NICE, IPC_LOCK]  # clock, sched_priority, lock_all
    ulimits:
      memlock: -1                    # lock_all
    devices:
      - /dev/pps0
    volumes:
      - ./chrony.conf:/etc/chrony/chrony.conf:ro
      - chrony-state:/var/lib/chrony # drift file survives restarts
      - chrony-run:/run/chrony       # chronyd.sock, shared with api
    tmpfs:
      - /run
    mem_limit: 128m
    restart: unless-stopped
    healthcheck:                     # chronyd answers on its command socket
      test: ["CMD", "chronyc", "-n", "tracking"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  gpsd:
    build:
      dockerfile_inline: |
        FROM alpine:3.24
        RUN apk add --no-cache gpsd
    command: gpsd -N -n -G /dev/ttyAMA2
    network_mode: host               # cgps/gpsmon on host via localhost:2947
    ipc: host                        # same SHM as chrony (see above)
    devices:
      - /dev/ttyAMA2
    depends_on: [chrony]
    mem_limit: 64m
    restart: unless-stopped

  api:
    build:
      context: .                     # needs web/ for the UI stage
      dockerfile: api/Dockerfile
    network_mode: host               # reaches gpsd on 127.0.0.1:2947; serves :8000
    user: "100:101"                  # chrony uid/gid in the chrony image: may use chronyd.sock
    env_file:
      - path: .env                   # MQTT_HOST, MQTT_USER, MQTT_PASSWORD, ... (see .env.example)
        required: false
    volumes:
      - chrony-run:/run/chrony
      - api-data:/data               # history.db, written in batches (HISTORY_FLUSH_MINUTES)
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on: [chrony, gpsd]
    cpus: 1.0                        # runaway guard; chronyd runs at RT priority anyway
    mem_limit: 192m                  # ~60 MiB with 24 h history + headroom for requests
    logging: *logging
    restart: unless-stopped
    healthcheck:                     # HTTP server responsive and gpsd + chronyd reachable (503 otherwise)
      test: ["CMD-SHELL", "wget -q -O /dev/null -T 5 http://127.0.0.1:$${API_PORT:-8000}/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  chrony-state:
  api-data:
  chrony-run:                        # tmpfs: socket only, keep it off the SD card
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: uid=100,gid=101,mode=0750
