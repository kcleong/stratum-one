# GPS/PPS-disciplined stratum-1 NTP server. See README.md for host prep.
services:
  chrony:
    build:
      dockerfile_inline: |
        FROM alpine:3.22
        RUN apk add --no-cache chrony ca-certificates
    command: chronyd -d -f /etc/chrony/chrony.conf
    network_mode: host               # UDP 123 without NAT; real client IPs
    ipc: shareable                   # gpsd writes NMEA time into SHM
    cap_add: [SYS_TIME, SYS_NICE, IPC_LOCK]  # clock, sched_priority, lock_all
    ulimits:
      memlock: -1                    # lock_all
    devices:
      - /dev/pps0
    volumes:
      - ./chrony.conf:/etc/chrony/chrony.conf:ro
      - chrony-state:/var/lib/chrony # drift file survives restarts
    tmpfs:
      - /run
    mem_limit: 128m
    restart: unless-stopped

  gpsd:
    build:
      dockerfile_inline: |
        FROM alpine:3.22
        RUN apk add --no-cache gpsd
    command: gpsd -N -n -G /dev/ttyAMA2
    network_mode: host               # cgps/gpsmon on host via localhost:2947
    ipc: "service:chrony"
    devices:
      - /dev/ttyAMA2
    depends_on: [chrony]
    mem_limit: 64m
    restart: unless-stopped

volumes:
  chrony-state:
