# GPS NMEA via gpsd SHM: coarse seconds, only used to number PPS pulses.
# Tune `offset` to the GPS offset shown by `chronyc sourcestats` (see README).
refclock SHM 0 refid GPS precision 1e-1 offset 0.10 delay 0.2 noselect

# PPS: the precise second edge, locked to GPS.
refclock PPS /dev/pps0 lock GPS refid PPS precision 1e-7 prefer

# NTS-authenticated, one per operator:
# BE hobbyist; DE PTB (national metrology institute); NL SIDN Labs;
# NL Duocast (hosting, stratum 1); UK University of Cambridge; SE Netnod; DE FAU (university).
server nts.teambelgium.net iburst nts
server ptbtime1.ptb.de iburst nts
server ntppool1.time.nl iburst nts
server ntp3.duocast.net iburst nts
server ntp1.cam.ac.uk iburst nts
server nts.netnod.se iburst nts
server ntp3.fau.de iburst nts

nocerttimecheck 1

# Internet fallback and sanity check.
#pool pool.ntp.org iburst maxsources 3

driftfile /var/lib/chrony/chrony.drift
# Keep the pid file out of the shared /run/chrony volume (a stale pid there
# would outlive this container).
pidfile /run/chronyd.pid
ntsdumpdir /var/lib/chrony
makestep 1 3
lock_all
sched_priority 1

# Public NTP Pool server: answer anyone; the router decides what reaches us
# (UDP 123 forwarded from WAN). For LAN-only use, restrict e.g. `allow 192.168.22.0/24`.
allow
# Abuse guard (powers of 2): per address 1 response per second on average (interval 0),
# bursts of 32; over the limit ~1 in 4 still answered (leak 2) so spoofed floods cannot
# lock out the real owner of an address. Sized for office NAT gateways with many devices
# behind one IPv4 address; single clients polling several times a second are still held back.
ratelimit interval 0 burst 32 leak 2
# Bound the per-client log (in locked memory; the container has mem_limit 128m).
clientloglimit 16777216
